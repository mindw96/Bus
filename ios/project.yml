name: UNISTBus

configs:
  Debug: debug
  DebugAPNsSandbox: debug
  Release: release

options:
  bundleIdPrefix: kr.ac.unist
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 4J7HGK26PF
    CURRENT_PROJECT_VERSION: "3"
    MARKETING_VERSION: "0.3.1"
    CLANG_ENABLE_MODULES: YES
    TARGETED_DEVICE_FAMILY: "1,2"
  configs:
    Debug:
      UNIST_BUS_API_BASE_URL: http://127.0.0.1:8080
      UNIST_BUS_APNS_ENVIRONMENT: development
      UNIST_BUS_PUSH_ENVIRONMENT: DEVELOPMENT
      UNIST_BUS_REMOTE_LIVE_ACTIVITY_ENABLED: NO
    DebugAPNsSandbox:
      UNIST_BUS_API_BASE_URL: https://unist-bus-api-60408467370.asia-northeast3.run.app
      UNIST_BUS_APNS_ENVIRONMENT: development
      UNIST_BUS_PUSH_ENVIRONMENT: DEVELOPMENT
      UNIST_BUS_REMOTE_LIVE_ACTIVITY_ENABLED: YES
    Release:
      UNIST_BUS_API_BASE_URL: https://unist-bus-api-60408467370.asia-northeast3.run.app
      UNIST_BUS_APNS_ENVIRONMENT: production
      UNIST_BUS_PUSH_ENVIRONMENT: PRODUCTION
      UNIST_BUS_REMOTE_LIVE_ACTIVITY_ENABLED: NO

targets:
  UNISTBus:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: UNISTBus
        excludes:
          - Info.plist
    info:
      path: UNISTBus/Info.plist
      properties:
        CFBundleDisplayName: UNIST Bus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UNISTBusAPIBaseURL: $(UNIST_BUS_API_BASE_URL)
        UNISTBusPushEnvironment: $(UNIST_BUS_PUSH_ENVIRONMENT)
        UNISTBusRemoteLiveActivityEnabled: $(UNIST_BUS_REMOTE_LIVE_ACTIVITY_ENABLED)
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: UNISTBus/UNISTBus.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: kr.ac.unist.bus
        PRODUCT_NAME: UNISTBus
    dependencies:
      - target: UNISTBusLiveActivity
        embed: true

  UNISTBusLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: UNISTBusLiveActivity
        excludes:
          - Info.plist
    info:
      path: UNISTBusLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: UNIST Bus Live Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.ac.unist.bus.LiveActivity
        PRODUCT_NAME: UNISTBusLiveActivity
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework

  UNISTBusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UNISTBusTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.ac.unist.busTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: UNISTBus

schemes:
  UNISTBus:
    build:
      targets:
        UNISTBus: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: UNISTBusTests

  UNISTBusAPNsSandbox:
    build:
      targets:
        UNISTBus: all
    run:
      config: DebugAPNsSandbox
    test:
      config: DebugAPNsSandbox
      gatherCoverageData: true
      targets:
        - name: UNISTBusTests
